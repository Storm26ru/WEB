<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <title>WebForms</title>
   
</head>
<body>
    <div id="header">
        Header
        <span id="mouse"></span>
        <div style="display:flex; width:300px; justify-content:space-between">
            <form style="display:flex; width:150px; justify-content:space-between; align-items:center">
                <label for="duration">Duration</label>
                <input type="number" min="1" id="duration" onchange="Duration()" style="width:30px; height:20px" />
            </form>
            <div style="width:120px"><div id="switch-background" onclick="SwitchBackground()"></div></div>
        </div>
    </div>
    <h1 >WebForms</h1>
    <form action="/" method="post">
        <label for="base">Основание степени</label>
        <input type="number" min="0" id="base" onchange="Power()" />
        <br />

        <label for="exponent">Показатель степени</label>
        <!--<input type="number" id="exponent">-->
       <input type="number" id="exponent" onchange="Power()" />
        <br />

        <div id="power"></div>
    </form>
    <script src="functions.js"> </script>
</body>
</html>
